name: Release

# Publishing uses PyPI Trusted Publishing (OpenID Connect): no API tokens are stored anywhere.
#   Dry run:  Actions tab -> Release -> "Run workflow"  => builds, tests, uploads to TestPyPI
#   Release:  git tag v0.3.0 && git push origin v0.3.0  => builds, tests, uploads to PyPI
# The tag must match `version` in pyproject.toml.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run ruff check src tests examples
      - run: uv run pytest -q
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(uv run python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match version $VERSION"; exit 1; }
      - run: uv build
      - name: Check metadata and install the wheel in a clean environment
        run: |
          uvx twine check dist/*
          uv venv "$RUNNER_TEMP/smoke-env"
          uv pip install --python "$RUNNER_TEMP/smoke-env" dist/*.whl
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke-env/bin/yantraa" experiment --limit 5
          "$RUNNER_TEMP/smoke-env/bin/yantraa" evaluate
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/yantraa-evidence
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/yantraa-evidence
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
